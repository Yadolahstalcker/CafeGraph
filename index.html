<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>کافه | منو</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap');

:root{
  --bg:#050505;
  --bg2:#0b0b0b;
  --card:#11110f;
  --card2:#151410;
  --ink:#f4efdf;
  --muted:#aaa18e;
  --line:#2b271c;
  --gold:#d4af37;
  --gold2:#f4d878;
  --gold3:#a47b16;
  --chip:#171612;
}

*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;
  position:relative;
  background:
    radial-gradient(circle at 10% 0%,rgba(212,175,55,.12),transparent 28%),
    radial-gradient(circle at 90% 100%,rgba(212,175,55,.08),transparent 30%),
    var(--bg);
  color:var(--ink);
  font-family:Vazirmatn,Tahoma,sans-serif;
}
body::before{
  content:"";
  position:fixed;
  top:0;
  bottom:0;
  left:0;
  width:2px;
  z-index:9998;
  pointer-events:none;
  background:var(--gold);
  box-shadow:0 0 12px rgba(212,175,55,.35);
}

body::after{
  content:"";
  position:fixed;
  top:0;
  bottom:0;
  right:0;
  width:2px;
  z-index:9998;
  pointer-events:none;
  background:var(--gold);
  box-shadow:0 0 12px rgba(212,175,55,.35);
}
.hero{
  padding:52px 20px 34px;
  text-align:center;
  background:linear-gradient(180deg,#15130e,var(--bg));
  border-bottom:1px solid rgba(212,175,55,.16);
}
.logo{
  width:68px;height:68px;border-radius:20px;margin:auto;
  display:grid;place-items:center;
  background:linear-gradient(145deg,var(--gold2),var(--gold3));
  color:#080808;font-size:32px;
  box-shadow:0 0 30px rgba(212,175,55,.25),0 12px 30px #0008;
  animation:logoFloat 2.8s ease-in-out infinite,logoGlow 2.2s ease-in-out infinite;
}
@keyframes logoFloat{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-7px) rotate(3deg)}}
@keyframes logoGlow{0%,100%{box-shadow:0 0 22px rgba(212,175,55,.18),0 12px 30px #0008}50%{box-shadow:0 0 38px rgba(212,175,55,.42),0 12px 30px #0008}}
h1{
  margin:16px 0 5px;font-size:32px;
  color:var(--gold2);
  text-shadow:0 0 22px rgba(212,175,55,.18);
}
.subtitle{color:var(--muted);margin:0}
.wrap{max-width:1100px;margin:auto;padding:0 18px 60px}
.toolbar{
  position:sticky;top:0;z-index:10;padding:16px 0;
  background:rgba(5,5,5,.86);
  backdrop-filter:blur(14px);
}
.search{display:flex;gap:10px;margin:0 0 12px;width:100%;max-width:none}
.search input{
  width:100%;border:1px solid var(--line);
  background:#0e0e0d;color:var(--ink);
  border-radius:14px;padding:13px 16px;font:inherit;outline:none;
  transition:.25s;
}
.search input::placeholder{color:#766f61}
.search input:focus{
  border-color:var(--gold);
  box-shadow:0 0 0 3px rgba(212,175,55,.09),0 0 22px rgba(212,175,55,.08);
}
.chips{display:flex;gap:8px;overflow:auto;padding-bottom:3px}
.chip{
  border:1px solid var(--line);background:var(--chip);
  padding:10px 15px;border-radius:999px;font:inherit;
  white-space:nowrap;cursor:pointer;color:var(--muted);
  transition:.25s;
}
.chip:hover{border-color:#665322;color:var(--gold2)}
.chip.active{
  background:linear-gradient(135deg,var(--gold2),var(--gold3));
  border-color:var(--gold);
  color:#090909;font-weight:700;
  box-shadow:0 5px 18px rgba(212,175,55,.18);
}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}
.filter{
  background:#0f0f0e;border:1px solid var(--line);
  border-radius:12px;padding:9px 12px;font:inherit;
  color:var(--muted);cursor:pointer;transition:.25s;
}
.filter:hover{border-color:#6b5720;color:var(--gold2)}
.filter.active{border-color:var(--gold);color:var(--gold2);box-shadow:0 0 16px rgba(212,175,55,.08)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.card{
  background:linear-gradient(145deg,var(--card),var(--card2));
  border:1px solid var(--line);
  border-radius:20px;padding:18px;
  transition:transform .28s ease,box-shadow .28s ease,border-color .28s ease;
  box-shadow:0 8px 25px #0007;
  animation:cardIn .55s ease both;
}
.card:hover{
  transform:translateY(-7px);
  border-color:rgba(212,175,55,.48);
  box-shadow:0 16px 38px #0009,0 0 22px rgba(212,175,55,.07);
}
@keyframes cardIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
.top{display:flex;justify-content:space-between;gap:12px}
.icon{
  width:52px;height:52px;border-radius:15px;
  background:linear-gradient(145deg,#2b2618,#17150f);
  border:1px solid rgba(212,175,55,.25);
  display:grid;place-items:center;font-size:25px;flex:none;
  transition:.3s;
  animation:iconFloat 3s ease-in-out infinite;
}
.card:hover .icon{
  transform:scale(1.13) rotate(-6deg);
  box-shadow:0 0 24px rgba(212,175,55,.22);
  border-color:var(--gold);
}
@keyframes iconFloat{0%,100%{translate:0 0}50%{translate:0 -3px}}
.badge{
  font-size:11px;color:#0a0906;
  background:linear-gradient(135deg,var(--gold2),var(--gold3));
  padding:5px 8px;border-radius:8px;height:max-content;font-weight:700;
}
.card h3{margin:12px 0 5px;font-size:18px;color:#f5efd9}
.desc{margin:0;color:var(--muted);font-size:13px;line-height:1.8;min-height:47px}
.bottom{display:flex;align-items:center;justify-content:space-between;margin-top:14px}
.price{font-weight:800;color:var(--gold2)}
.unit{font-size:11px;color:var(--muted);font-weight:400}
.bottom>span:last-child{color:#8e866f;font-size:12px}
.empty{text-align:center;padding:50px;color:var(--muted);display:none}
footer{text-align:center;color:#625c4f;font-size:12px;padding:35px 0}
button{
  -webkit-appearance:none;
  appearance:none;
  outline:none;
}
button:focus-visible{
  outline:2px solid var(--gold);
  outline-offset:2px;
}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{
    animation-duration:.01ms !important;
    animation-iteration-count:1 !important;
    transition-duration:.01ms !important;
    scroll-behavior:auto !important;
  }
}
@media(max-width:800px){.grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:520px){
  h1{font-size:26px}.grid{grid-template-columns:1fr}
  .hero{padding-top:35px}.card{padding:16px}
}
</style>
</head>
<body>

const catBox=document.querySelector("#categories");
let activeCat="همه", activeFilter="all", query="";

document.querySelectorAll(".filter").forEach(b=>b.classList.toggle("active",b.dataset.filter==="all"));

function render(){
 const q=query.trim().toLowerCase();
 const result=items.filter(x=>
   (activeCat==="همه"||x.cat===activeCat) &&
   (activeFilter==="all" || (activeFilter==="popular"?x.popular:x.cat===activeFilter)) &&
   (!q || `${x.name} ${x.cat} ${x.desc}`.toLowerCase().includes(q))
 );
 document.querySelector("#grid").innerHTML=result.map((x,i)=>`
   <article class="card" style="animation-delay:${Math.min(i*0.045,0.35)}s">

 document.querySelector("#empty").style.display=result.length?"none":"block";
}

document.querySelector("#filters").addEventListener("click",e=>{if(!e.target.matches(".filter"))return;activeFilter=e.target.dataset.filter;document.querySelectorAll(".filter").forEach(b=>b.classList.toggle("active",b===e.target));render()});
